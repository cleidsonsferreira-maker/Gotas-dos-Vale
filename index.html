<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doações Gotas do Vale | Instituto CEIFA</title>
    <meta name="description" content="Doações Gotas do Vale — Faça você também parte dessa missão. Contribua via Pix com o Instituto CEIFA.">
    <meta property="og:title" content="Doações Gotas do Vale">
    <meta property="og:description" content="Faça você também parte dessa missão.">
    <meta property="og:url" content="https://doacoes-gotas-do-vale.netlify.app/">
    <meta property="og:image" content="https://doacoes-gotas-do-vale.netlify.app/criancas-fundo.jpg">
    <meta name="theme-color" content="#f7c99a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #E87A14;
            --orange-dark: #c9640a;
            --text: #2b2b2b;
            --muted: #5a5a5a;
            --green: #16a34a;
            --meadow: #3f7a3a;
            --meadow-dark: #2c5a34;
            --whatsapp: #25D366;
            --whatsapp-dark: #1ebe5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            color: var(--text);
            line-height: 1.6;
            background: var(--meadow-dark);
        }

        /* Imagem das crianças como fundo fixo da página */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url("criancas-fundo.jpg") center top / cover no-repeat, #f7c99a;
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0) 55%,
                rgba(30, 60, 30, 0.35) 100%);
        }

        /* Primeira tela: a imagem em destaque */
        .hero {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 24px 20px 40px;
            text-align: center;
        }

        .headline {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 22px 30px 24px;
            max-width: 620px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
            animation: subir 0.9s ease-out both;
        }

        h1 {
            font-size: clamp(1.9rem, 5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.15;
            color: var(--orange);
        }

        .subtitle {
            margin-top: 8px;
            font-size: clamp(1.1rem, 2.8vw, 1.4rem);
            font-weight: 700;
            color: var(--text);
        }

        .btn-doar {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--orange);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(232, 122, 20, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-doar:hover { background: var(--orange-dark); transform: translateY(-2px); }

        .btn-doar svg { animation: pular 1.6s ease-in-out infinite; }

        /* Cartão de doação */
        .donate {
            padding: 20px 20px 60px;
            display: flex;
            justify-content: center;
        }

        .donation-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 34px 26px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        }

        .donation-card h2 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text);
        }

        .donation-card p {
            color: var(--muted);
            margin: 6px 0 22px;
        }

        .qr-wrapper {
            background: #fff;
            padding: 14px;
            border: 3px dashed var(--orange);
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 22px;
        }

        .qr-wrapper img {
            width: 220px;
            height: 220px;
            display: block;
        }

        .pix-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .pix-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.8rem;
            color: #495057;
            word-break: break-all;
            margin-bottom: 18px;
            user-select: all;
            text-align: left;
        }

        .btn-copy {
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            max-width: 360px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(232, 122, 20, 0.35);
        }

        .btn-copy:hover { background: var(--orange-dark); transform: translateY(-2px); }

        .btn-copy.copied {
            background: var(--green);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35);
        }

        /* Área de Compartilhamento */
        .share-section {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e9ecef;
        }

        .share-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .share-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn-share {
            color: #fff;
            border: none;
            padding: 13px 22px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            flex: 1 1 165px;
            max-width: 210px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-share:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 6px 18px rgba(220, 39, 67, 0.35);
        }

        .share-feedback {
            margin-top: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--green);
            min-height: 1.4em;
        }

        footer {
            text-align: center;
            padding: 0 20px 30px;
            color: #fff;
            font-size: 0.9rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        @keyframes subir {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes pular {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        /* Celular: mostra a ilustração inteira no topo, sem cortar as crianças */
        @media (max-aspect-ratio: 1/1) {
            .bg {
                background:
                    url("criancas-fundo.jpg") center top / 100% auto no-repeat,
                    linear-gradient(to bottom, #f7c99a 0%, var(--meadow) 45%, var(--meadow-dark) 100%);
            }
            .hero {
                min-height: auto;
                padding-top: calc(85.4vw - 40px);
            }
        }

        @media (max-width: 480px) {
            .headline { padding: 18px 20px 20px; }
            .qr-wrapper img { width: 190px; height: 190px; }
            .btn-share { max-width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .headline, .btn-doar svg { animation: none; }
        }
    </style>
</head>
<body>

    <div class="bg" role="img" aria-label="Ilustração de crianças diversas rindo e brincando no vale, com a logo do Instituto CEIFA"></div>

    <section class="hero">
        <div class="headline">
            <h1>Doações Gotas do Vale</h1>
            <p class="subtitle">Faça você também parte dessa missão.</p>
            <a class="btn-doar" href="#doar">
                Quero doar
